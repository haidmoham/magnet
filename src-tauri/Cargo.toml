[package]
name = "magnet-player"
version = "0.1.0-alpha.2"
description = "A dense Spotify desktop client with an authored visual layer"
authors = ["Mo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "magnet_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
