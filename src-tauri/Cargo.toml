[package]
name = "magnet"
version = "0.1.0-alpha.3"
description = "A dense Spotify desktop client with an authored visual layer"
authors = ["Mo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "magnet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# librespot 0.8's build script requires the 9.0.x vergen API. 9.1 introduced
# a split vergen-lib version that currently breaks that upstream build.
vergen = "=9.0.6"

[dependencies]
base64 = "0.22"
crossbeam-queue = "0.3"
getrandom = "0.2"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
librespot = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"

# Tauri's Linux backend still depends on the archived GTK3 bindings, which
# require glib 0.18. The upstream 0.18 backport fixes the unsound
# VariantStrIter out-parameter without changing the GTK3 API.
[patch.crates-io]
glib = { git = "https://github.com/gtk-rs/gtk-rs-core", rev = "ea720152f28e293ef4362ee844ee5cc499f32d2a" }
